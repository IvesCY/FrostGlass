name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with .NET Framework
        shell: powershell
        run: .\build.ps1

      - name: Package portable app
        shell: powershell
        run: |
          Compress-Archive -Path @('毛玻璃.exe', '毛玻璃.exe.config', 'README.md') `
            -DestinationPath 'FrostGlass-portable.zip' -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: FrostGlass-portable
          path: FrostGlass-portable.zip

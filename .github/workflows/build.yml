name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with .NET Framework
        shell: powershell
        run: .\build.ps1

      - name: Package portable app
        shell: powershell
        run: |
          $exe = Get-ChildItem -Filter '*.exe' | Select-Object -First 1
          Compress-Archive -Path @($exe.FullName, ($exe.Name + '.config'), 'README.md') `
            -DestinationPath 'FrostGlass-portable.zip' -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: FrostGlass-portable
          path: FrostGlass-portable.zip
